
buildscript {
    repositories {
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "Mojang"
            url = "https://libraries.minecraft.net/"
        }
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroupByRegex "org\\.spongepowered(\\..*)?"
            }
        }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = 'KaziAdditions'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Maven Central
    mavenCentral()

    // User-supplied Mine Mine no Mi and Cart Addon builds.
    // A flat repository lets ForgeGradle deobfuscate their production JARs.
    flatDir {
        dirs 'libs'
    }

    // Minecraft Forge
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net/"
    }

    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
        content {
            includeGroupByRegex "org\\.spongepowered(\\..*)?"
        }
    }

    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }

    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }

    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }

    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }

    //
    maven {
        name = "Sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }

    maven {
        name = "Maven"
        url = "https://repo1.maven.org/maven2/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("local:mine-mine-no-mi-1.16.5:0.10.11")
    implementation fg.deobf("local:cartaddon:0.7.5")
    implementation fg.deobf("curse.maven:curios-309927:4419403")

    implementation 'net.jodah:typetools:0.6.3'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


}

// Force specific version of typetools
configurations.all {
    resolutionStrategy {
        force 'net.jodah:typetools:0.6.3'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The IDE launches from this snapshot, not directories that incremental compilers
// clear while the game is running. Refresh it only as a game-launch prerequisite.
tasks.register('prepareStableRunClient', Sync) {
    dependsOn 'prepareRunClientCompile', 'classes'
    into layout.buildDirectory.dir('client-runtime')
    from(sourceSets.main.output.classesDirs) { into 'classes' }
    from(sourceSets.main.output.resourcesDir) { into 'resources' }
}

// Gradle's runClient also needs isolation: another build can clear main classes
// while Minecraft is still running and lazily loading combat/VFX classes.
def isolatedClientDir = layout.projectDirectory.dir(".gradle/client-runtimes/${UUID.randomUUID()}")
def isolatedClientSources = sourceSets.create('isolatedClientRuntime') {
    java.setSrcDirs([])
    resources.setSrcDirs([])
    output.classesDirs.setFrom(isolatedClientDir.dir('classes'))
    output.resourcesDir = isolatedClientDir.dir('resources').asFile
}
isolatedClientSources.runtimeClasspath = sourceSets.main.runtimeClasspath.minus(sourceSets.main.output).plus(isolatedClientSources.output)

tasks.register('prepareIsolatedRunClient', Sync) {
    dependsOn 'classes'
    into isolatedClientDir
    from(sourceSets.main.output.classesDirs) { into 'classes' }
    from(sourceSets.main.output.resourcesDir) { into 'resources' }
}
tasks.register('cleanupIsolatedRunClient', Delete) {
    delete isolatedClientDir
}
tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareIsolatedRunClient'
    finalizedBy 'cleanupIsolatedRunClient'
    doFirst {
        def config = runConfig.get()
        config.sources = config.sources.collect { it == sourceSets.main ? isolatedClientSources : it }
        config.mods.each { mod ->
            mod.sources = mod.sources.collect { it == sourceSets.main ? isolatedClientSources : it }
        }
    }
}
